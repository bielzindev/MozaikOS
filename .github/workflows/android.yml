name: Android build

on:
  push:
    branches-ignore: ["ci-screenshots"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ZUNEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zunex.jks"
            echo "ZUNEX_KEYSTORE=$RUNNER_TEMP/zunex.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ZUNEX_KEYSTORE_BASE64 secret missing: APKs signed with a throwaway debug key (updates will conflict)"
          fi

      - name: Weather photos (public domain, Wikimedia Commons)
        run: bash scripts/fetch-weather-photos.sh

      - name: Build debug and release APKs
        env:
          ZUNEX_KEYSTORE_PASSWORD: ${{ secrets.ZUNEX_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --continue assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "^e: |ERROR:|error:|What went wrong" -A3 build.log | head -300

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: windows-phone-reborn-apk
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/full/release/app-full-release.apk dist/Mozaik.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk dist/Mozaik-Lite.apk

      - name: Publish release with the APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mozaik (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            - **Mozaik-Lite.apk**: versão leve, sem permissões de SMS, registro de chamadas e chamada direta (menos bloqueios do Play Protect). Mensagens e o histórico de chamadas abrem os apps do Android.
            - **Mozaik.apk**: versão completa (Mensagens próprio, app de SMS padrão, histórico de chamadas).

            Instale no Android (permita "instalar apps desconhecidos") e defina como app de tela inicial padrão.

            Todas as builds a partir da build-25 usam a mesma assinatura: atualizações instalam por cima, sem desinstalar. (Vindo de uma build anterior, desinstale uma última vez.)
          files: |
            dist/Mozaik-Lite.apk
            dist/Mozaik.apk
