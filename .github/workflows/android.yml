name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --continue assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: grep -E "^e: |^w: .*error|ERROR:|error:|What went wrong" -A3 build.log | head -300

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: windows-phone-reborn-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
