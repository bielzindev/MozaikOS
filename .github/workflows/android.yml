name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --continue assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "^e: |ERROR:|error:|What went wrong" -A3 build.log | head -300

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: windows-phone-reborn-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/WindowsPhoneReborn.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/WindowsPhoneReborn-debug.apk

      - name: Publish release with the APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Windows Phone Reborn (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Baixe **WindowsPhoneReborn.apk** abaixo e instale no Android (permita "instalar apps desconhecidos").
            Depois, defina como app de tela inicial padrão.
          files: |
            dist/WindowsPhoneReborn.apk
            dist/WindowsPhoneReborn-debug.apk
