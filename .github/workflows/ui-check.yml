name: UI check (emulator)

# Manual only: the emulator run takes up to 45 minutes of Actions time per push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Weather photos (public domain, Wikimedia Commons)
        run: bash scripts/fetch-weather-photos.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullDebug

      - name: Generate test media (songs with tags and cover art, photos)
        run: |
          # Static ffmpeg from pip: apt packages interfered with the emulator.
          pip install -q imageio-ffmpeg
          ffmpeg() { "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$@"; }
          mkdir -p testmedia
          ffmpeg -loglevel error -f lavfi -i color=c=0x0050EF:s=400x400 -frames:v 1 testmedia/cover1.png
          ffmpeg -loglevel error -f lavfi -i color=c=0xD80073:s=400x400 -frames:v 1 testmedia/cover2.png
          i=0
          for spec in "Lumia Song|Nokia Band|Windows Phone Hits|cover1|1" "Metro Light|Nokia Band|Windows Phone Hits|cover1|2" \
                      "Live Tiles|Segoe Orchestra|Panorama|cover2|1" "Turnstile|Segoe Orchestra|Panorama|cover2|2"; do
            IFS='|' read -r title artist album cover track <<< "$spec"
            i=$((i+1))
            ffmpeg -loglevel error -f lavfi -i "sine=frequency=$((300+i*80)):duration=30" -i "testmedia/$cover.png" \
              -map 0:a -map 1:v -c:a libmp3lame -q:a 6 -c:v mjpeg -id3v2_version 3 -disposition:v attached_pic \
              -metadata title="$title" -metadata artist="$artist" -metadata album="$album" -metadata track="$track" \
              "testmedia/song$i.mp3"
          done
          j=0
          for src in testsrc mandelbrot smptebars rgbtestsrc testsrc2 life; do
            j=$((j+1))
            ffmpeg -loglevel error -f lavfi -i "$src=size=1200x900" -frames:v 1 "testmedia/IMG_2026103$j.jpg"
          done
          ls -la testmedia

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 900
          disable-animations: false
          script: bash scripts/ui-check.sh

      - name: Run on emulator (retry when it failed to boot)
        if: steps.emu1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 900
          disable-animations: false
          script: bash scripts/ui-check.sh

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          [ -d ui-results ] || exit 0
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp -r ui-results "$tmp/"
          git checkout --orphan ci-screenshots
          git rm -rfq .
          cp -r "$tmp/ui-results" .
          echo "${{ github.sha }}" > ui-results/commit.txt
          git add ui-results
          git commit -qm "UI screenshots for ${{ github.sha }}"
          git push -f origin ci-screenshots
