name: UI check (emulator)

on:
  push:
    branches-ignore: ["ci-screenshots"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          emulator-boot-timeout: 900
          disable-animations: false
          script: bash scripts/ui-check.sh

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          [ -d ui-results ] || exit 0
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp -r ui-results "$tmp/"
          git checkout --orphan ci-screenshots
          git rm -rfq .
          cp -r "$tmp/ui-results" .
          echo "${{ github.sha }}" > ui-results/commit.txt
          git add ui-results
          git commit -qm "UI screenshots for ${{ github.sha }}"
          git push -f origin ci-screenshots
